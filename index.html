<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Hari Guru Nasional!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1d2671, #c33764);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .signature {
            font-style: italic;
            font-size: 0.95rem;
            color: #ffcccc;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎓 Selamat Hari Guru! 🍎</h1>
        <p>Terima kasih atas kesabaran, ilmu, dan inspirasi yang luar biasa. Engkau bukan hanya seorang pengajar, tetapi juga pelita yang menerangi jalan kami menuju masa depan.</p>
        <div class="signature">
            <p>Terima kasih, Bapak/Ibu Guru.<br><strong>— Dari Muridmu yang Bangga</strong></p>
        </div>
    </div>

</body>
</html>
